<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./reset.css">
  <link rel="stylesheet" href="./index.css">
  <script src="./main.js" defer></script>
  <title>Calculator</title>
</head>

<body>
  <main>
    <div class="container">
      <div class="calculator">
        <div class="history"></div>
        <input type="text" class="display-inp">

        <div class="calc-body">
          <div class="row">
            <button title="C">C</button>
            <button title="(">(</button>
            <button title=")">)</button>
            <button title="%">%</button>
            <button title="AC" id="clear-all">AC</button>
          </div>
          <div class="row">
            <button title="7" class="num">7</button>
            <button title="8" class="num">8</button>
            <button title="9" class="num">9</button>
            <button title="÷" class="num">÷</button>
            <button title="√" id="sqrt">√</button>
          </div>
          <div class="row">
            <button title="4" class="num">4</button>
            <button title="5" class="num">5</button>
            <button title="6" class="num">6</button>
            <button title="*">×</button>
            <button title="^" >^</button>
          </div>
          <div class="row">
            <button title="1" class="num">1</button>
            <button title="2" class="num">2</button>
            <button title="3" class="num">3</button>
            <button title="-">-</button>
            <button title="⌫">⌫</button>
          </div>
          <div class="row">
            <button title="0" class="num">0</button>
            <button title=".">.</button>
            <button title="log" id="log">log</button>
            <button title="+">+</button>
            <button title="=" class="equal">=</button>
          </div>

        </div>
      </div>
    </div>
  </main>
</body>

</html>
